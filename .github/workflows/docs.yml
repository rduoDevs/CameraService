# Builds the Moonwave site and publishes it to GitHub Pages.
#
# Once this workflow has run successfully once, go to
# Settings → Pages → Build and deployment → Source = "GitHub Actions".

name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Moonwave
        run: npm i -g moonwave@latest

      - name: Build site
        # `--code .` tells Moonwave to scan the project root for Lua source
        # (CameraService.lua sits at the repo root rather than in src/ or lib/).
        run: moonwave build --code . --publish

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
